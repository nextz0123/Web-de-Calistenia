:root {
  --glass-bg: rgba(255,255,255,0.12);
  --glass-bg-strong: rgba(255,255,255,0.18);
  --glass-border: rgba(255,255,255,0.22);
  --glass-blur: 18px;
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --glass-bg: rgba(255,255,255,0.07);
    --glass-bg-strong: rgba(255,255,255,0.11);
    --glass-border: rgba(255,255,255,0.14);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.35);

:root[data-theme="dark"] {
  --glass-bg: rgba(255,255,255,0.07);

  --glass-shadow: 0 8px 32px rgba(0,0,0,0.35);

:root[data-theme="light"] {
  --glass-bg: rgba(255,255,255,0.45);
  --glass-bg-strong: rgba(255,255,255,0.6);
  --glass-border: rgba(255,255,255,0.55);
  --glass-shadow: 0 8px 32px rgba(0,0,0,0.08);
}

/* Cards com glass */
.card {
  background: var(--glass-bg) !important;
  backdrop-filter: blur(var(--glass-blur)) saturate(160%);
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
  border: 1px solid var(--glass-border) !important;
  box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.12);
  border-radius: 24px !important;
}

/* Nav inferior / lateral com glass */
nav {
  background: rgba(23,24,27,0.55) !important;
  backdrop-filter: blur(22px) saturate(180%);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.12) !important;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.1);

  background: rgba(23,24,27,0.65) !important;
  backdrop-filter: blur(20px) saturate(160%);

}

.pill {
  background: var(--glass-bg) !important;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border) !important;

  background: var(--lime) !important;
  border-color: var(--lime) !important;
  color: #111 !important;
  backdrop-filter: none;
}

/* Inputs com glass */
input, textarea, .selw {
  background: var(--glass-bg) !important;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--glass-border) !important;
}

/* Banner de instalar */
.install-banner {
  background: rgba(23,24,27,0.7) !important;
  backdrop-filter: blur(20px) saturate(160%);
  -webkit-backdrop-filter: blur(20px) saturate(160%);
  border: 1px solid rgba(255,255,255,0.14);
}

.mds {
  background: rgba(28,29,34,0.75) !important;

  -webkit-backdrop-filter: blur(24px) saturate(160%);

/* ===== PWA: Manifest + Service Worker + Install ===== */
(function(){
  // Manifest embutido
  const manifest = {
    name: "My Core",
    short_name: "My Core",
    description: "My Core - treino de calistenia progressivo com registro e hábitos.",
    start_url: "./",
    display: "standalone",

    lang: "pt-BR",
    icons: [
      {
        src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%23111111'/%3E%3Ccircle cx='256' cy='256' r='60' fill='%23d7f25a'/%3E%3Ccircle cx='256' cy='110' r='32' fill='%23d7f25a'/%3E%3Ccircle cx='360' cy='150' r='32' fill='%23d7f25a'/%3E%3Ccircle cx='402' cy='256' r='32' fill='%23d7f25a'/%3E%3Ccircle cx='360' cy='362' r='32' fill='%23d7f25a'/%3E%3Ccircle cx='256' cy='402' r='32' fill='%23d7f25a'/%3E%3Ccircle cx='152' cy='362' r='32' fill='%23d7f25a'/%3E%3Ccircle cx='110' cy='256' r='32' fill='%23d7f25a'/%3E%3Ccircle cx='152' cy='150' r='32' fill='%23d7f25a'/%3E%3C/svg%3E",
        sizes: "any",
        type: "image/svg+xml",
        purpose: "any maskable"
      }
    ]
  };

  // Injeta o manifest
  const mBlob = new Blob([JSON.stringify(manifest)], {type: "application/json"});
  const mUrl = URL.createObjectURL(mBlob);
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = mUrl;
  document.head.appendChild(link);

  // Service Worker mínimo (cache da própria página)
  const swCode = `
    const CACHE = "calis-v1";
    self.addEventListener("install", e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(["./"]).catch(()=>{})));
      self.skipWaiting();
    });
    self.addEventListener("activate", e => {
      e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))));
      self.clients.claim();
    });
    self.addEventListener("fetch", e => {
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).then(res => {
          const copy = res.clone();
          if (e.request.method === "GET" && res.status === 200) {
            caches.open(CACHE).then(c => c.put(e.request, copy)).catch(()=>{});
          }
          return res;
        }).catch(() => caches.match("./")))
      );
    });
  `;
  if ("serviceWorker" in navigator) {
    try {
      const swBlob = new Blob([swCode], {type: "application/javascript"});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl).catch(err => console.log("SW fail", err));
    } catch(e) { console.log("SW error", e); }
  }

  // Banner de instalação
  let deferredPrompt = null;
  const banner = document.getElementById("installBanner");
  const btn = document.getElementById("installBtn");
  const close = document.getElementById("installClose");

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    // Só mostra se ainda não estiver instalado e se o usuário não fechou recentemente
    const dismissed = localStorage.getItem("calis_install_dismiss");
    if (!dismissed && banner) {
      setTimeout(() => banner.classList.add("on"), 1800);
    }
  });

  if (btn) btn.addEventListener("click", async () => {
    if (!deferredPrompt) {
      // Fallback iOS / instrução
      alert("No iPhone: toque em Compartilhar → Adicionar à Tela de Início.\\nNo Android: use o menu do navegador → Instalar app.");
      return;
    }
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    deferredPrompt = null;
    if (banner) banner.classList.remove("on");
  });

  if (close) close.addEventListener("click", () => {
    if (banner) banner.classList.remove("on");
    localStorage.setItem("calis_install_dismiss", Date.now().toString());
  });

  // Esconde o banner se já estiver em modo standalone
  if (window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone) {
    if (banner) banner.style.display = "none";
  }
})();
